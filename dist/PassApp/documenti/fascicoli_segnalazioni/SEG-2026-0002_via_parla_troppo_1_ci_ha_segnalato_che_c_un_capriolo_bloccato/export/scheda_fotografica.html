<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Scheda fotografica segnalazione n. 2</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .meta { margin-bottom: 18px; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    figure { margin: 0; border: 1px solid #ddd; padding: 10px; break-inside: avoid; }
    img { width: 100%; max-height: 220px; object-fit: contain; background: #f5f5f5; }
    figcaption { font-size: 12px; margin-top: 8px; color: #444; }
  </style>
</head>
<body>
  <h1>Scheda fotografica segnalazione n. 2</h1>
  <div class="meta">
    Luogo: Via Parla troppo, 1<br>
    Data: 30/04/2026<br>
    Foto: 3
  </div>
  <section class="grid">
    <figure><img src="../foto/thorx3.jpg" alt="thorx3.jpg"><figcaption>thorx3.jpg<br>sopralluogo</figcaption></figure><figure><img src="../foto/h_t_4.jpg" alt="h_t_4.jpg"><figcaption>h_t_4.jpg<br>segnalazione</figcaption></figure><figure><img src="../foto/harley_1.jpg" alt="harley_1.jpg"><figcaption>harley_1.jpg<br>segnalazione</figcaption></figure>
  </section>
</body>
</html>
